name: sync

run-name: sync / ${{ inputs.request_id || 'manual' }} / ${{ inputs.region || 'all' }}

on:
  workflow_dispatch:
    inputs:
      region:
        description: 同期対象の地域
        required: true
        default: all
        type: choice
        options:
          - all
          - chiba
          - tokyo
          - saitama
      request_id:
        description: 起動要求の追跡ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: map-sync-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout private sync core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: so032019/map-sync-core
          ref: 4d6061c0e02be994cc9e1e2f4bf7e87838db8408
          token: ${{ secrets.MAP_SYNC_CORE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Install runtime dependency
        run: python3 -m pip install --disable-pip-version-check -r core/requirements.txt

      - name: Synchronize regions
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          args=(python3 core/scripts/cloud_sync.py)
          if [[ "${{ inputs.region }}" == "all" ]]; then
            args+=(--region chiba --region tokyo --region saitama)
          else
            args+=(--region "${{ inputs.region }}")
          fi
          "${args[@]}"
