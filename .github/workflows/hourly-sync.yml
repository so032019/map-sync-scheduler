name: sync

run-name: sync / ${{ inputs.request_id || 'vacancy-events-real-e2e-1' }} / ${{ inputs.region || 'chiba' }}

on:
  push:
    branches:
      - feat/ops-sync-reporting
  workflow_dispatch:
    inputs:
      region:
        description: 同期対象の地域
        required: true
        default: all
        type: choice
        options:
          - all
          - chiba
          - tokyo
          - saitama
          - kanagawa
      request_id:
        description: 起動要求の追跡ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: map-sync-hourly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      OPS_API_URL: ${{ vars.OPS_API_URL || 'https://ur-life-map-ops-api-staging.ur-lifemap-admin.workers.dev' }}
      SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
    steps:
      - name: Checkout private sync core
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: so032019/map-sync-core
          ref: 131aa58879996efc397e7e6bcd28e481e00dfbf1
          token: ${{ secrets.MAP_SYNC_CORE_READ_TOKEN }}
          path: core
          persist-credentials: false

      - name: Install runtime dependency
        run: python3 -m pip install --disable-pip-version-check -r core/requirements.txt

      - name: Synchronize regions
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          UR_LIFE_MAP_PUBLIC_ROOT: ${{ github.workspace }}/core
          SYNC_REQUEST_ID: ${{ inputs.request_id || 'vacancy-events-real-e2e-1' }}
        run: |
          set -euo pipefail
          args=(python3 core/scripts/cloud_sync.py)
          args+=(--timeout 120)
          region="${{ inputs.region || 'chiba' }}"
          if [[ "$region" == "all" ]]; then
            args+=(--region chiba --region tokyo --region saitama --region kanagawa)
          else
            args+=(--region "$region")
          fi
          "${args[@]}"
